spring.application.name=sirh
server.port=8081
# --- Base de données PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/gestionrh
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}

# Le schéma vient des scripts du dossier migrations/, Hibernate n'y touche pas
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- JSP ---
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# --- Configuration du recrutement (secrets fournis par l'environnement) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.cv.dossier-stockage=${APP_CV_DOSSIER_STOCKAGE:${user.home}/sirh-cv}
app.mail.actif=${APP_MAIL_ACTIF:false}
app.mail.expediteur=${APP_MAIL_EXPEDITEUR:no-reply@example.invalid}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.recrutement.rh-employe-ids=${APP_RECRUTEMENT_RH_EMPLOYE_IDS:}
app.recrutement.jours-feries=${APP_RECRUTEMENT_JOURS_FERIES:}
app.recrutement.tolerance-experience-annees=${APP_RECRUTEMENT_TOLERANCE_EXPERIENCE:1}
app.recrutement.tolerance-niveau-etude=${APP_RECRUTEMENT_TOLERANCE_NIVEAU:1}
app.recrutement.delai-etude-jours=${APP_RECRUTEMENT_DELAI_ETUDE_JOURS:5}
app.recrutement.rappel-cron=${APP_RECRUTEMENT_RAPPEL_CRON:0 0 8 * * *}
