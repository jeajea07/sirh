<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — TeamUp</title>
<link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/layout.css">
</head>
<body data-role="hub" data-page="connexion" data-root="" data-title="Connexion">
<div class="login">
  <div class="login-side"><img src="assets/logo-original.png" alt="TeamUp"></div>
  <div class="login-form"><form data-validate data-after="connecter" novalidate class="stack">
    <div><h1>Connexion</h1><p class="muted" style="margin-top:4px">Accédez à votre espace TeamUp.</p></div>
    <div class="form-errors"></div>
    <div class="field"><label for="id">Identifiant *</label><input type="text" id="id" required></div>
    <div class="field"><label for="pw">Mot de passe *</label><input type="password" id="pw" required></div>
    <div class="field"><label for="espace">Espace (démo uniquement)</label><select id="espace">
      <option value="candidat/suivi.html">Candidat</option><option value="rh/dashboard.html">RH</option><option value="technicien/candidats.html">Technicien</option>
      <option value="dg/candidats.html">Direction générale</option><option value="direction/corrections.html">Direction responsable</option><option value="admin/utilisateurs.html">Administration</option></select>
      <span class="hint">En production, l’espace est déduit du compte.</span></div>
    <button class="btn btn-primary btn-block" type="submit">Se connecter</button>
    <p class="small center"><a href="index.html" style="text-decoration:underline">Retour à l’accueil du template</a></p>
  </form></div>
</div>
<script>function connecter() { window.location.href = document.getElementById('espace').value; }</script>
<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>

</body>
</html>
