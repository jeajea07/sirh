<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test technique — TeamUp</title>
<link rel="icon" href="../assets/logo.svg">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/layout.css">
</head>
<body data-role="rh" data-page="test" data-root="../" data-title="Test technique">
<main>
  <div class="page-head">
    <div><h1>Test technique — Développeur web</h1><p>Seuil de réussite : <b>12 / 20</b> (fixé avant le test). 14 points en questions à cocher, 6 points en réponses libres.</p></div>
    <div class="row"><button class="btn btn-sm" id="simuler" title="Démonstration">Démo : correction terminée</button><button class="btn btn-primary" id="confirmer-admis">Confirmer les admis</button></div>
  </div>
  <div id="alerte-test" style="margin-bottom:14px"></div>
  <div class="card card-flat"><div class="table-wrap"><table>
    <thead><tr><th>Candidat</th><th>Questions à cocher</th><th>Réponses libres</th><th>Total</th><th>Résultat</th><th></th></tr></thead>
    <tbody id="test-body"></tbody>
  </table></div></div>
</main>
<div class="modal-back" id="exception" role="dialog" aria-modal="true" aria-label="Accorder une exception">
  <div class="modal">
    <div class="modal-head"><h2>Accorder une exception</h2><button class="x" data-close aria-label="Fermer">&times;</button></div>
    <form data-validate data-success="Exception accordée. Le candidat reçoit un nouvel accès au test." data-close-modal novalidate>
  <div class="modal-body"><div class="form-errors"></div>
    <div class="field" style="margin-top:6px"><label for="motif1">Motif de l’exception *</label><textarea id="motif1" required placeholder="Exemple : absence justifiée par un certificat"></textarea>
    <span class="hint">Le motif est gardé dans l’historique avec votre nom et la date.</span></div></div>
  <div class="modal-foot"><button type="button" class="btn" data-close>Annuler</button><button class="btn btn-primary" type="submit">Accorder l’exception</button></div>
</form>
    
  </div>
</div>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/shell.js"></script>
<script src="../assets/js/rh.js"></script>
</body>
</html>
