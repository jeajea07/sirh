<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grille et notes — TeamUp</title>
<link rel="icon" href="../assets/logo.svg">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/layout.css">
</head>
<body data-role="technicien" data-page="notes" data-root="../" data-title="Grille et notes" data-level="2">
<main>
  <div class="page-head"><div><h1>Entretien 2 — Grille technique</h1><p>Candidat : <b id="nom-candidat"></b>. Notes de 1 à 5, la grille est connue à l’avance et figée.</p></div>
    <select id="choix-candidat" style="width:auto" aria-label="Candidat"></select></div>
  <div class="grid g-main">
    <div class="stack">
      <div class="card"><div id="questions"></div></div>
      <div class="card"><div class="field"><label for="com">Commentaire pour le RH</label><textarea id="com"></textarea></div></div>
      <div class="row" style="justify-content:flex-end"><button class="btn btn-primary" id="enregistrer">Enregistrer les notes</button></div>
    </div>
    <div class="stack sticky">
      <div class="card"><p class="muted small">Note générale (pondérée par l’importance)</p><div class="big-score"><span id="moyenne">—</span><span class="muted small"> / 5</span></div>
        <div class="bar" style="margin:10px 0 6px"><span id="barre-moyenne" style="width:0"></span></div><p class="muted small" id="seuil"></p>
        <div style="margin-top:12px" id="eliminatoires"></div><div style="margin-top:12px" id="verdict"></div></div>
      <div class="card"><h3 style="margin-bottom:8px">Niveaux précédents</h3><div id="precedents"></div></div>
    </div>
  </div>
</main>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/shell.js"></script>
<script src="../assets/js/notes.js"></script>
</body>
</html>
