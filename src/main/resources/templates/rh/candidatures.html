<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candidatures — TeamUp</title>
<link rel="icon" href="../assets/logo.svg">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/layout.css">
</head>
<body data-role="rh" data-page="candidatures" data-root="../" data-title="Candidatures">
<main>
  <div class="page-head">
    <div><h1>Candidatures</h1><p>Le classement est automatique, vous validez. Délai maximum : 5 jours ouvrables.</p></div>
  </div>
  <div class="tabs">
    <button class="tab active" data-filtre="tous">Toutes<span class="count" id="n-tous">0</span></button>
    <button class="tab" data-filtre="conforme">Conformes<span class="count" id="n-conforme">0</span></button>
    <button class="tab" data-filtre="regarder">À regarder<span class="count" id="n-regarder">0</span></button>
    <button class="tab" data-filtre="non">Non conformes<span class="count" id="n-non">0</span></button>
    <button class="tab" data-filtre="reserve">Réserve spontanée<span class="count">2</span></button>
  </div>
  <div class="card card-flat" id="liste-candidatures"><div class="table-wrap"><table>
    <thead><tr><th>Candidat</th><th>Offre</th><th>Reçu le</th><th>Attente</th><th>Classement</th><th>État</th><th></th></tr></thead>
    <tbody id="candidatures-body"></tbody>
  </table></div></div>
  <div class="card card-flat hidden" id="liste-reserve"><div class="table-wrap"><table>
    <thead><tr><th>Candidat</th><th>Domaine</th><th>Reçu le</th><th class="right">Rattacher à une offre</th></tr></thead>
    <tbody id="reserve-body"></tbody>
  </table></div></div>
</main>
<div class="modal-back" id="dossier" role="dialog" aria-modal="true" aria-label="Dossier du candidat">
  <div class="modal">
    <div class="modal-head"><h2 id="dossier-titre">Dossier</h2><button class="x" data-close aria-label="Fermer">&times;</button></div>
    <div class="modal-body" id="dossier-corps"></div>
    <div class="modal-foot"><button class="btn" data-close>Fermer</button><button class="btn btn-ok" id="valider-dossier">Valider et prévenir le candidat</button></div>
  </div>
</div>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/shell.js"></script>
<script src="../assets/js/rh.js"></script>
</body>
</html>
