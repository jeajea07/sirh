spring.application.name=sirh

# --- Base de données PostgreSQL ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestionrh}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Le schéma vient des scripts du dossier migrations/, Hibernate n'y touche pas
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- JSP ---
# Les vues du recrutement (Bloc 2A) restent sous /WEB-INF/views.
# Un résolveur dédié sert les vues historiques et les vues Bloc 3/4 sous /WEB-INF/jsp.
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# --- Fichiers et formats ---
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.mvc.format.date=iso
spring.mvc.format.date-time=iso

# --- Configuration du recrutement (secrets fournis par l'environnement) ---
app.cv.dossier-stockage=${APP_CV_DOSSIER_STOCKAGE:${user.home}/sirh-cv}
app.mail.actif=${APP_MAIL_ACTIF:false}
app.mail.expediteur=${APP_MAIL_EXPEDITEUR:no-reply@example.invalid}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.nom-expediteur=${APP_MAIL_NOM_EXPEDITEUR:TeamUp Recrutement}
# URL publique utilisée dans les liens des e-mails (espace candidat, offres)
app.site.url=${APP_SITE_URL:http://localhost:8080}

# Identifiants SMTP réels : fichier LOCAL hors dépôt Git (voir config/mail.properties.example).
# Ses valeurs remplacent celles ci-dessus ; absent => envoi simulé dans les journaux.
spring.config.import=optional:file:${user.home}/.sirh/mail.properties
app.recrutement.rh-employe-ids=${APP_RECRUTEMENT_RH_EMPLOYE_IDS:}
app.recrutement.jours-feries=${APP_RECRUTEMENT_JOURS_FERIES:}
app.recrutement.tolerance-experience-annees=${APP_RECRUTEMENT_TOLERANCE_EXPERIENCE:1}
app.recrutement.tolerance-niveau-etude=${APP_RECRUTEMENT_TOLERANCE_NIVEAU:1}
app.recrutement.delai-etude-jours=${APP_RECRUTEMENT_DELAI_ETUDE_JOURS:5}
app.recrutement.rappel-cron=${APP_RECRUTEMENT_RAPPEL_CRON:0 0 8 * * *}

# Fusion Bloc 1 → Bloc 2 : offre créée en brouillon dès la validation finale de la DG (date limite pré-remplie) ;
# la validation RH la publie sur la vitrine. true = publication directe sans validation RH (écart au Bloc 2).
app.recrutement.publication-automatique=${APP_RECRUTEMENT_PUBLICATION_AUTO:false}
app.recrutement.duree-publication-jours=${APP_RECRUTEMENT_DUREE_PUBLICATION:30}

# --- Bloc 6 : temps de travail (valeurs à confirmer avec le Code du travail, Loi n° 2003-044) ---
app.temps.calcul-cron=${APP_TEMPS_CALCUL_CRON:0 30 1 * * *}
app.temps.jours-recalcul=7
app.temps.duree-max-jour-heures=10
app.temps.duree-max-hebdo-heures=48
app.temps.jours-consecutifs-max=6
app.temps.delai-prevenance-planning-jours=1
app.temps.delai-justification-jours=3
app.temps.heures-mensuelles-reference=173.33
app.temps.majoration-heures-sup=0.30
app.temps.majoration-nuit=0.30
app.temps.majoration-dimanche=0.40
app.temps.majoration-ferie=0.50
# --- Bloc 7 : congés et absences ---
app.conges.acquisition-mensuelle-jours=2.5
app.conges.permissions-annuelles-jours=10
app.conges.delai-validation-manager-jours=3
